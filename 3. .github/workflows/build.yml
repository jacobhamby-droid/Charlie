name: Build Charlie Firmware
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO & Build
        run: |
          pip install platformio
          pio run
      - name: Upload Firmware File
        uses: actions/upload-artifact@v4
        with:
          name: charlie-firmware
          path: .pio/build/charlie-1.75/firmware.bin
